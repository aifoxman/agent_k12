name: Android build and checks

on:
  push:
    branches: [main, release, 'fix/uvc-full-frame']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Chinese font for synthetic paper checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install and verify API
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
  android:
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Check published UVC mode and lifecycle policy
        run: |
          mkdir -p "$RUNNER_TEMP/uvc-policy"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/uvc-policy" src/android/child/src/main/java/com/paperbetween/app/UvcModeFallback.java tests/native/UvcModeFallbackHarness.java
          java -cp "$RUNNER_TEMP/uvc-policy" com.paperbetween.app.UvcModeFallbackHarness
      - name: Install and verify client
        working-directory: src/client
        run: |
          npm ci
          npm test
          npm run lint
          npm run format:check
          npm run build
      - name: Restore development signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          export ANDROID_DEBUG_KEYSTORE_PATH="$RUNNER_TEMP/paperbetween-debug.keystore"
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$ANDROID_DEBUG_KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_DEBUG_KEYSTORE_PATH"
          chmod 600 "$ANDROID_DEBUG_KEYSTORE_PATH"
      - name: Build Android apps
        working-directory: src/android
        run: bash ./gradlew --no-daemon :child:assembleDebug :parent:assembleDebug
      - name: Record artifact hashes
        run: |
          expected=$(keytool -exportcert -keystore "$ANDROID_DEBUG_KEYSTORE_PATH" -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')
          for apk in src/android/child/build/outputs/apk/debug/child-debug.apk src/android/parent/build/outputs/apk/debug/parent-debug.apk; do
            actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')
            test "$actual" = "$expected"
          done
          sha256sum src/android/child/build/outputs/apk/debug/child-debug.apk src/android/parent/build/outputs/apk/debug/parent-debug.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: |
            src/android/child/build/outputs/apk/debug/child-debug.apk
            src/android/parent/build/outputs/apk/debug/parent-debug.apk
            SHA256SUMS
          retention-days: 14
          if-no-files-found: error
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/paperbetween-debug.keystore"
