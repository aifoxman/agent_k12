services:
  turn:
    image: coturn/coturn:4.18.0-r0
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in .env}
      - --realm=${TURN_HOST:?Set TURN_HOST in .env}
      - --external-ip=${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP in .env}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --no-cli
    restart: unless-stopped
