services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /data/homework.sqlite3
    volumes:
      - homework_data:/data
    restart: unless-stopped
  web:
    image: caddy:2
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  homework_data:
  caddy_data:
  caddy_config:
