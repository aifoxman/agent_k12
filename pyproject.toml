[project]
name = "family-homework-mvp"
version = "0.1.0"
description = "Family homework companion API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opencc>=1.4,<2",
  "pillow>=11,<13",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets==17.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]
asr = [
  "av>=11,<19",
  "faster-whisper>=1.2,<2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k12_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
